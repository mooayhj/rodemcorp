<!DOCTYPE html>
<!--
  로뎀코퍼레이션 · 시공 사진 갤러리 페이지 (002_gallery_0825.html)
  · 메인 페이지(index.html)와 같은 폴더에 두세요.
  · 상단 메뉴·푸터·글자(I18N 사전)는 메인 페이지와 동일합니다. 글자를 고칠 때는 두 파일의 I18N 사전을 같이 고쳐 주세요.
  · 갤러리 본문 글자는 I18N 사전의 gal.* 항목이며, 사진은 각 프로젝트의 <div class="photo"> 안 내용을 실제
    <img src="사진파일.jpg" alt="설명"> 로 바꿔 넣으면 됩니다.
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロデムコーポレーション | RODEM CORPORATION — 建築金属マテリアルの調達・輸出</title>
<meta name="description" content="ロデムコーポレーションは、株式会社裕昌の精密な建築金属マテリアルを日本の建設現場へ調達・輸出する日韓専門商社です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#FFFFFF;
    --steel-900:#F3F9FF;
    --steel-850:#E9F2FA;
    --steel-800:#DDE9F4;
    --steel-700:#C9DAE9;
    --steel-600:#B4C8DA;
    --line:#D6E2EC;
    --line-soft:#E6EDF4;
    --steel-400:#5E7186;
    --steel-300:#4A5C6E;
    --steel-200:#2B3B4A;
    --steel-100:#16232F;
    --paper:#0B141D;
    /* YooChang ENC blue — light base */
    --ink:#0D2135;
    --bronze:#0060B4;
    --bronze-hi:#2E8FDB;
    --bronze-dim:#003F78;
    --navy:#132D48;
    --hero-deep:#081420;

    --disp:'Archivo',sans-serif;
    --mono:'Space Mono',monospace;
    --kr:'Noto Sans KR',sans-serif;
    --jp:'Noto Sans JP',sans-serif;

    --maxw:1280px;
    --pad:clamp(24px,6vw,72px);
    --ease:cubic-bezier(.16,.84,.32,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--graphite);
    color:var(--steel-200);
    font-family:var(--kr);
    font-weight:400;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .jp{font-family:var(--jp)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

  /* ---------- utility bits ---------- */
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--bronze);
    display:inline-flex;
    align-items:center;
    gap:12px;
  }
  .eyebrow::before{
    content:"";width:26px;height:1px;background:var(--bronze);display:inline-block;
  }
  .eyebrow--center::after{
    content:"";width:26px;height:1px;background:var(--bronze);display:inline-block;
  }
  .disp{font-family:var(--disp);font-weight:800;line-height:1.02;letter-spacing:-.01em;color:var(--ink)}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:60;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
    transition:background .3s,border-color .3s;
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    height:72px;
  }
  .brand{display:flex;align-items:center;gap:13px}
  .brand__mark{
    width:34px;height:34px;flex:none;position:relative;
    display:grid;place-items:center;
  }
  .brand__mark img{
    width:100%;height:100%;object-fit:contain;display:block;
  }
  .brand__txt b{
    font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.14em;color:var(--ink);display:block;line-height:1;
  }
  .brand__txt small{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--steel-400);text-transform:uppercase;
    display:block;line-height:1;margin-top:2px;
  }
  .menu{display:flex;align-items:center;gap:34px}
  .menu a{
    font-size:13.5px;font-weight:500;color:var(--steel-200);letter-spacing:.02em;position:relative;padding:4px 0;
  }
  .menu a::after{
    content:"";position:absolute;left:0;bottom:-2px;width:0;height:1.5px;background:var(--bronze);transition:width .3s;
  }
  .menu a:hover{color:var(--ink)}
  .menu a:hover::after{width:100%}
  /* 카탈로그 · 실적표 : 문의에서 띄우고 사각 테두리 버튼으로 */
  .menu a.menu__btn{
    border:1px solid var(--steel-600);color:var(--ink);padding:8px 16px;line-height:1.2;
    transition:border-color .25s,background .25s,color .25s;
  }
  .menu a.menu__btn::after{display:none}
  .menu a.menu__btn:hover{border-color:var(--bronze);background:rgba(0,91,172,.06)}
  .menu a{white-space:nowrap}
  .menu a.menu__btn--first{margin-left:14px}
  .menu a.menu__btn:not(.menu__btn--first){margin-left:-20px}
  @media(min-width:961px) and (max-width:1200px){
    .menu{gap:18px}.menu a{font-size:13px}
    .menu a.menu__btn{padding:7px 11px}
    .menu a.menu__btn--first{margin-left:6px}
    .menu a.menu__btn:not(.menu__btn--first){margin-left:-8px}
  }
  /* 일본어는 글자가 길어 좁은 폭에서 메뉴가 줄바꿈되므로 조금 일찍 햄버거 메뉴로 전환 */
  @media(max-width:1100px){
    body[data-lang="ja"] .menu{display:none}
    body[data-lang="ja"] .burger{display:flex}
    body[data-lang="ja"] .nav .langsw{margin-left:auto;margin-right:14px}
  }
  .nav__cta{
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--steel-600);color:var(--ink);padding:9px 18px;transition:.25s;
  }
  .nav__cta:hover{border-color:var(--bronze);background:var(--bronze);color:#fff}
  .burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:6px}
  .burger span{width:24px;height:2px;background:var(--ink);transition:.3s}

  /* ---------- hero ---------- */
  .hero{
    position:relative;min-height:100vh;padding-top:176px;padding-bottom:84px;overflow:hidden;
    background:linear-gradient(160deg,var(--hero-deep),var(--ink) 60%);
  }
  .hero__bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--hero-deep)}
  .hero__bg video{
    position:absolute;top:50%;left:50%;width:100%;height:120%;
    min-width:100%;min-height:120%;
    object-fit:cover;
    transform:translate(-50%,-50%) translateY(var(--parallax,0px));
    will-change:transform;
  }
  .hero__overlay{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 90% at 82% 8%, rgba(0,147,212,.10), transparent 55%),
      linear-gradient(100deg,
        rgba(243,249,255,.58) 0%,
        rgba(243,249,255,.46) 26%,
        rgba(243,249,255,.20) 55%,
        rgba(243,249,255,.08) 78%,
        rgba(243,249,255,.04) 100%),
      linear-gradient(180deg,
        rgba(243,249,255,.02) 0%,
        rgba(243,249,255,.18) 78%,
        rgba(243,249,255,.42) 100%);
  }
  .hero__inner{position:relative;z-index:3}
  .hero__eyebrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:38px}
  .hero__eyebrow .tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--steel-300);text-transform:uppercase;
    border:1px solid var(--line);padding:6px 12px;
  }
  .hero__eyebrow .tag b{color:var(--bronze-hi);font-weight:700}
  h1.hero__title{
    font-family:var(--disp);font-weight:900;color:var(--ink);
    font-size:clamp(40px,7.6vw,96px);line-height:.96;letter-spacing:-.025em;
    text-transform:uppercase;
  }
  h1.hero__title .kr{
    display:block;font-family:var(--kr);font-weight:900;letter-spacing:-.01em;
    font-size:clamp(24px,4vw,48px);color:var(--steel-300);text-transform:none;margin-top:22px;line-height:1.3;
  }
  h1.hero__title em{font-style:normal;color:var(--bronze)}
  h1.hero__title .red{font-style:normal;color:#E4002B}
  .hero__lead{
    max-width:560px;margin:30px 0 0;font-size:clamp(15px,1.6vw,17px);color:var(--steel-400);line-height:1.9;
    word-break:keep-all;overflow-wrap:break-word;
  }
  .hero__actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:44px}
  .btn{
    display:inline-flex;align-items:center;gap:11px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;padding:15px 26px;transition:.25s;border:1px solid transparent;
  }
  .btn--primary{background:var(--bronze-dim);color:#fff;font-weight:700}
  .btn--primary:hover{background:var(--bronze)}
  .btn--ghost{border-color:var(--steel-600);color:var(--ink)}
  .btn--ghost:hover{border-color:var(--bronze);background:rgba(0,91,172,.06)}
  .btn svg{width:15px;height:15px}

  /* ---------- hero intro (영상 아래, 스크롤하면 나타나는 문구 영역) ---------- */
  .hero-intro{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--hero-deep),var(--ink) 70%);
    padding:clamp(64px,9vw,110px) 0 clamp(48px,7vw,88px);
  }
  .hero-intro h1.hero__title{color:#fff}
  .hero-intro h1.hero__title .kr{color:rgba(255,255,255,.62)}
  .hero-intro .hero__lead{color:rgba(255,255,255,.68)}
  .hero-intro .hero__lead strong{color:#fff!important;font-weight:700}

  /* ---------- hero scroll cue ---------- */
  .hero__scrollcue{
    position:absolute;left:var(--pad);bottom:30px;z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--steel-300);
    opacity:1;transition:opacity .5s var(--ease);pointer-events:none;
  }
  .hero__scrollcue svg{width:16px;height:9px;animation:scrollcue-bounce 1.8s ease-in-out infinite}
  body.scrolled .hero__scrollcue{opacity:0}
  @keyframes scrollcue-bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(6px)}
  }

  /* gallery cta (network section bottom button) */
  .gallery-cta{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:48px}
  .gallery-cta .btn{padding:16px 32px}

  /* route */
  .route{
    position:relative;z-index:2;margin-top:76px;
    padding:22px 26px 16px;border-radius:4px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 16px 40px rgba(4,12,20,.28);
  }
  .route__label{
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
    letter-spacing:.16em;color:var(--steel-400);text-transform:uppercase;margin-bottom:14px;
  }
  .route__label b{color:var(--steel-200);font-weight:700}
  .route svg{width:100%;height:64px;display:block;overflow:visible}

  /* stat strip */
  /* Business-performance style dark band, sitting on its own between hero and about */
  .stats-sec{
    background:linear-gradient(160deg,var(--hero-deep),var(--navy) 120%);
    padding:56px 0;
  }
  .stats{ margin:0; }
  .stats__row{display:grid;grid-template-columns:repeat(5,1fr)}
  .stat{padding:12px 22px;border-left:1px solid rgba(255,255,255,.14)}
  .stat:first-child{border-left:0}
  .stat b{font-family:var(--disp);font-weight:800;font-size:clamp(30px,4vw,44px);color:#fff;line-height:1;display:block}
  .stat b i{font-style:normal;color:var(--bronze-hi);font-size:.6em;margin-left:2px}
  .stat span{font-size:12.5px;color:var(--steel-400);margin-top:10px;display:block;letter-spacing:.02em}

  /* ---------- section base ---------- */
  section{position:relative}
  .sec{padding:clamp(84px,11vw,144px) 0}
  .sec-head{max-width:720px;margin-bottom:68px}
  .sec-head h2{
    font-family:var(--kr);font-weight:900;color:var(--ink);font-size:clamp(30px,4.4vw,48px);
    line-height:1.18;margin-top:0;letter-spacing:-.015em;
  }
  .sec-head h2 em{font-style:normal;color:var(--bronze)}
  .sec-head p{margin-top:20px;color:var(--steel-300);font-size:15.5px;line-height:1.85}
  .idx{font-family:var(--mono);font-size:12px;color:var(--steel-400);letter-spacing:.2em}

  /* ---------- about ---------- */
  .about{background:var(--steel-900);border-top:1px solid var(--line-soft)}
  .about__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
  .about__body p{color:var(--steel-300);font-size:15.5px;margin-bottom:20px;line-height:1.9}
  .about__body p strong{color:var(--ink);font-weight:700}
  .bridge{
    position:relative;border:1px solid var(--line);background:
      linear-gradient(180deg,var(--steel-850),var(--steel-900));padding:38px 34px;
  }
  .bridge__row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;text-align:center}
  .node{padding:22px 10px}
  .node b{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--ink);display:block;letter-spacing:.04em}
  .node span{font-size:12px;color:var(--steel-400);margin-top:6px;display:block}
  .node .jp{font-size:12.5px;color:var(--steel-300)}
  .bridge__arrow{color:var(--bronze);display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em}
  .bridge__arrow svg{width:52px;height:14px}
  .bridge__mid{
    margin:26px auto 0;text-align:center;padding-top:24px;border-top:1px dashed var(--line);
  }
  .bridge__mid b{font-family:var(--disp);font-weight:800;color:var(--bronze);font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .bridge__mid span{display:block;color:var(--steel-300);font-size:13.5px;margin-top:8px}

  /* ---------- process ---------- */
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:0}
  .step{padding:34px 28px;border-left:1px solid var(--line);position:relative;transition:background .3s}
  .step:first-child{border-left:0}
  .step:hover{background:var(--steel-850)}
  .step__no{font-family:var(--mono);font-size:12px;color:var(--bronze);letter-spacing:.18em}
  .step__ico{width:40px;height:40px;margin:22px 0 20px;color:var(--steel-200)}
  .step h3{font-family:var(--kr);font-weight:700;color:var(--ink);font-size:17px;margin-bottom:5px}
  .step h3 .jp{font-weight:400;font-size:12.5px;color:var(--steel-400);display:block;margin-top:4px;letter-spacing:.04em}
  .step p{font-size:13.5px;color:var(--steel-400);line-height:1.75;margin-top:12px}

  /* ---------- products ---------- */
  .products{background:var(--steel-900);border-top:1px solid var(--line-soft)}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .pcard{
    background:var(--graphite);padding:34px 30px;min-height:210px;display:flex;flex-direction:column;
    transition:background .35s,transform .35s;position:relative;overflow:hidden;
  }
  .pcard:hover{background:var(--steel-850)}
  .pcard__k{display:none} /* decluttered: mono product-code tag removed from visual design */
  .pcard h3{font-family:var(--kr);font-weight:700;color:var(--ink);font-size:19px;margin-top:34px;line-height:1.3}
  .pcard h3 .jp{display:block;font-weight:400;font-size:13px;color:var(--steel-400);margin-top:6px;letter-spacing:.03em}
  .pcard p{font-size:13px;color:var(--steel-400);margin-top:12px;line-height:1.7}
  /* 5 cards: last card fills the remaining cell so the grid has no empty slot */
  .pgrid .pcard:last-child:nth-child(3n+2){grid-column:span 2}
  .pcard__line{
    position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--bronze);transition:width .4s;
  }
  .pcard:hover .pcard__line{width:100%}

  /* product photo preview (hover on PC / tap on mobile) */
  .pcard--preview{cursor:pointer;overflow:visible}
  .pcard--preview .pcard__hint{
    position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,91,172,.08);color:var(--bronze);display:flex;align-items:center;justify-content:center;
    transition:background .3s,color .3s,transform .3s;
  }
  .pcard--preview .pcard__hint svg{width:13px;height:13px}
  .pcard--preview:hover .pcard__hint,
  .pcard--preview.is-active .pcard__hint{background:var(--bronze);color:#fff;transform:scale(1.08)}
  .pcard--preview:hover,.pcard--preview.is-active{z-index:9}
  .pcard__preview{
    position:absolute;left:50%;bottom:calc(100% + 14px);top:auto;width:min(240px,72vw);
    transform:translate(-50%,8px) scale(.92);border-radius:12px;overflow:hidden;
    background:#fff;border:1px solid rgba(255,255,255,.75);box-shadow:0 20px 46px rgba(14,34,51,.32);
    opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;z-index:5;
  }
  .pcard__preview::after{
    content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:7px solid transparent;border-top-color:#fff;
  }
  .pcard__preview img{display:block;width:100%;height:auto}
  .pcard__preview .cap{
    padding:8px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    color:var(--steel-400);text-transform:uppercase;border-top:1px solid var(--line-soft);background:#fff;
  }
  .pcard--preview:hover .pcard__preview,
  .pcard--preview.is-active .pcard__preview{
    opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto;
  }

  /* ---------- network ---------- */
  .net__grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .partner{
    border:1px solid var(--line);background:var(--steel-900);padding:40px 36px;position:relative;
  }
  .partner__logo{
    display:block;margin:0 auto 26px;max-width:220px;max-height:64px;
    width:auto;height:auto;object-fit:contain;
  }
  @media (max-width:640px){
    .partner__logo{max-width:170px;max-height:52px;margin:0 auto 20px}
  }
  .partner__flag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--bronze);text-transform:uppercase}
  .partner h3{font-family:var(--disp);font-weight:800;color:var(--ink);font-size:26px;margin:16px 0 4px;letter-spacing:.02em}
  .partner .ko{font-family:var(--kr);font-weight:700;color:var(--steel-100);font-size:16px}
  .partner .jp{color:var(--steel-300);font-size:14.5px}
  .partner__role{
    display:inline-block;margin:18px 0 16px;font-size:12px;color:var(--steel-300);
    border:1px solid var(--line);padding:5px 12px;font-family:var(--mono);letter-spacing:.06em;
  }
  .partner p{color:var(--steel-400);font-size:14px;line-height:1.85}
  .partner ul{list-style:none;margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
  .partner li{font-size:11.5px;color:var(--steel-300);border:1px solid var(--line-soft);padding:5px 10px;font-family:var(--mono);letter-spacing:.03em}

  /* record */
  .record{margin-top:26px;border:1px solid var(--line);background:var(--steel-900)}
  .record__head{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .record__head b{font-family:var(--kr);font-weight:700;color:var(--ink);font-size:15px}
  .record__head span{font-family:var(--mono);font-size:11px;color:var(--steel-400);letter-spacing:.14em}
  .rrow{display:grid;grid-template-columns:1.4fr 1fr .8fr;padding:18px 30px;border-bottom:1px solid var(--line-soft);gap:16px;transition:background .25s}
  .rrow:last-child{border-bottom:0}
  .rrow:hover{background:var(--steel-850)}
  .rrow b{font-family:var(--kr);font-weight:700;color:var(--steel-100);font-size:14.5px}
  .rrow span{font-size:13px;color:var(--steel-400)}

  form{border:1px solid var(--line);background:var(--graphite);padding:36px}

  /* ---------- footer ---------- */
  footer{background:var(--graphite);border-top:1px solid var(--line);padding:60px 0 34px}

  .foot__col h4{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--steel-400);text-transform:uppercase;margin-bottom:18px}
  .foot__col a{display:block;color:var(--steel-300);font-size:13.5px;padding:6px 0;transition:color .2s}
  .foot__col a:hover{color:var(--bronze)}
  /* partner logo buttons (footer) : 3 logos share one fixed logo box so they read as the same size */
  .foot__col .plogos{display:flex;flex-direction:column;gap:10px}
  .foot__col a.plogo{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;max-width:240px;height:64px;padding:0 26px;
    background:#fff;border:1px solid var(--line);
    transition:border-color .25s,background .25s,box-shadow .25s,transform .25s;
  }
  /* 파트너 로고: 박스 안에서 왼쪽 기준선에 맞춰 정렬 + 심볼(큐브) 크기를 비슷하게 보정 */
  .foot__col a.plogo{justify-content:flex-start;padding:0 30px 0 22px}
  .foot__col a.plogo img{display:block;width:auto;max-width:100%;height:30px;object-fit:contain;object-position:left center}
  .foot__col a.plogo:nth-child(2) img{width:188px;height:auto}      /* YOOCHANG E&C : 가로로 긴 로고 */
  .foot__col a.plogo:nth-child(3) img{height:34px;margin-left:-3px} /* 유창금속 : 이미지 자체 왼쪽 여백 보정 */
  .foot__col a.plogo:nth-child(4) img{height:45px}                  /* YOOCHANG JAPAN : 하단 일본어 문구 포함 */
  /* 회사 주소 */

  .foot__site{font-size:13px;line-height:1.75;color:var(--steel-300)}
  .foot__site b{font-weight:700;color:var(--ink)}
  .foot__col a.plogo::after{
    content:"\2197";position:absolute;top:6px;right:8px;font-size:11px;line-height:1;
    color:var(--steel-500,var(--steel-400));transition:color .25s;
  }
  .foot__col a.plogo:hover{
    border-color:var(--bronze);background:rgba(0,91,172,.04);
    box-shadow:0 6px 18px rgba(14,34,51,.08);transform:translateY(-1px);
  }
  .foot__col a.plogo:hover::after{color:var(--bronze)}
  .foot__col a.plogo:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
  .foot__bottom{display:flex;justify-content:space-between;align-items:center;padding-top:26px;flex-wrap:wrap;gap:14px}
  .foot__bottom small{font-family:var(--mono);font-size:11px;color:var(--steel-400);letter-spacing:.06em}
  .foot__bottom .langs{display:flex;gap:8px}
  .foot__bottom .langs span{font-family:var(--mono);font-size:11px;color:var(--steel-400);border:1px solid var(--line);padding:4px 10px;letter-spacing:.1em}
  .foot__bottom .langs span.on{color:var(--bronze);border-color:var(--bronze-dim)}

  /* light-base 보정 */
  .partner,.record,.bridge,form{box-shadow:0 1px 2px rgba(14,34,51,.04),0 12px 30px rgba(14,34,51,.05)}
  .pcard:hover{background:var(--steel-900)}
  .step:hover{background:var(--steel-900)}
  .rrow:hover{background:var(--steel-900)}
  .drawer{box-shadow:-20px 0 60px rgba(14,34,51,.12)}

  /* reveal — one restrained, cascading motion per section rather than repeated per-element fades */
  .rv{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .rv.in{opacity:1;transform:none}
  .pgrid .pcard.rv:nth-child(1){transition-delay:0ms}
  .pgrid .pcard.rv:nth-child(2){transition-delay:60ms}
  .pgrid .pcard.rv:nth-child(3){transition-delay:120ms}
  .pgrid .pcard.rv:nth-child(4){transition-delay:180ms}
  .pgrid .pcard.rv:nth-child(5){transition-delay:240ms}
  .pgrid .pcard.rv:nth-child(6){transition-delay:300ms}
  .pgrid .pcard.rv:nth-child(7){transition-delay:360ms}
  .pgrid .pcard.rv:nth-child(8){transition-delay:420ms}
  .pgrid .pcard.rv:nth-child(9){transition-delay:480ms}
  .flow .step.rv:nth-child(1){transition-delay:0ms}
  .flow .step.rv:nth-child(2){transition-delay:80ms}
  .flow .step.rv:nth-child(3){transition-delay:160ms}
  .flow .step.rv:nth-child(4){transition-delay:240ms}
  .rrow.rv:nth-child(1){transition-delay:0ms}
  .rrow.rv:nth-child(2){transition-delay:70ms}
  .rrow.rv:nth-child(3){transition-delay:140ms}
  .rrow.rv:nth-child(4){transition-delay:210ms}
  .net__grid .partner.rv:nth-child(1){transition-delay:0ms}
  .net__grid .partner.rv:nth-child(2){transition-delay:120ms}

  /* ---------- responsive ---------- */

  @media(prefers-reduced-motion:reduce){

  }

/* ---------- language switching ---------- */
var LANGS=['ko','en','ja'], STORE='rodem-lang';
function pickLang(){
  var q=new URLSearchParams(location.search).get('lang');
  if(LANGS.indexOf(q)>-1) return q;
  try{var s=localStorage.getItem(STORE); if(LANGS.indexOf(s)>-1) return s;}catch(e){}
  return 'ja'; // ✏ 수정: 처음 접속(파일을 직접 열거나 검색을 통해 들어온 경우) 시 기본 언어를 일본어로 고정
}
function setLang(l,save){
  var d=I18N[l]; if(!d) return;
  document.documentElement.lang=l;
  document.body.setAttribute('data-lang',l);
  document.querySelectorAll('[data-t]').forEach(function(el){
    var v=d[el.getAttribute('data-t')];
    if(v===undefined) return;
    el.innerHTML=v;
    el.style.display = (v==='') ? 'none' : '';
  });
  document.querySelectorAll('[data-t-ph]').forEach(function(el){
    var v=d[el.getAttribute('data-t-ph')]; if(v!==undefined) el.setAttribute('placeholder',v);
  });
  document.querySelectorAll('[data-t-aria]').forEach(function(el){
    var v=d[el.getAttribute('data-t-aria')]; if(v!==undefined) el.setAttribute('aria-label',v);
  });
  document.title=d['nav.network']+' | '+d['meta.title'];
  var m=document.querySelector('meta[name="description"]'); if(m) m.setAttribute('content',d['meta.desc']);
  document.querySelectorAll('[data-lang-btn]').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang-btn')===l);
  });
  if(save!==false){ try{localStorage.setItem(STORE,l);}catch(e){} }
}
document.querySelectorAll('[data-lang-btn]').forEach(function(b){
  b.addEventListener('click',function(){ setLang(b.getAttribute('data-lang-btn')); drawer.classList.remove('open'); });
});

    removeEventListener('scroll',onFirstScroll);
    removeEventListener('wheel',onFirstScroll);

  }

  else{

})();

/* ---------- hero video parallax (single restrained motion cue) ---------- */
var heroVideo=document.querySelector('.hero__bg video');
var heroSection=document.querySelector('.hero');
var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(heroVideo && heroSection && !reduceMotion){
  var ticking=false;
  addEventListener('scroll',function(){
    if(!ticking){
      requestAnimationFrame(function(){
        var h=heroSection.offsetHeight;
        var p=Math.min(Math.max(scrollY/h,0),1);
        heroVideo.style.setProperty('--parallax',(p*40)+'px');
        ticking=false;
      });
      ticking=true;
    }
  });
}

/* ---------- scroll reveal ---------- */
var io=new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.rv').forEach(function(el){io.observe(el);});

  if(im.complete) show(); else {im.addEventListener('load',show); im.addEventListener('error',show); setTimeout(show,1500);}
})();
